{% if pagination.pages>1 %}
    <nav class="pagination" aria-label="Halaman data">
        {% if pagination.has_prev %}
            <a
                class="button secondary"
                href="{{ request.path }}?page={{ pagination.prev_num }}&q={{ search|urlencode }}&status={{ status|default('')|urlencode }}"
            >Sebelumnya</a>
        {% endif %}
        <span>{{ pagination.page }} / {{ pagination.pages }}</span>
        {% if pagination.has_next %}
            <a
                class="button secondary"
                href="{{ request.path }}?page={{ pagination.next_num }}&q={{ search|urlencode }}&status={{ status|default('')|urlencode }}"
            >Berikutnya</a>
        {% endif %}
    </nav>
{% endif %}
