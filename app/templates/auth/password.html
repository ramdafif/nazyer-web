{% extends "base.html" %}
{% from 'components/forms.html' import field %}
{% block body %}
    <main id="main" class="auth-shell">
        <h1>Ganti password</h1>
        <form method="post">
            {{ form.hidden_tag() }}{{ field(form.current_password) }}{{ field(form.password) }}{{ field(form.confirm) }}{{ form.submit(class_='button') }}
        </form>
        <a href="{{ url_for('admin.dashboard') }}">Kembali ke dashboard</a>
    </main>
{% endblock %}
