# Separate NEW virtual host. Substitute dj.example.com, do not overwrite other sites.
# HTTP bootstrap: enable first, verify, then run certbot --nginx -d dj.example.com.
# Certbot adds the TLS server/certificate paths and redirect after validation.
# First include nginx-static-cache.conf.example as a NEW conf.d file (http context).
# Also include nginx-log-format.conf.example in http {}; create the site's log directory.
# Required: include rate-limits.conf.example in http {} before loading this vhost.
server {
    listen 80;
    server_name dj.example.com;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/dj-nazyer/access.log nazyer_safe;

    # If an equivalent gzip policy is already active globally, inherit it instead.
    # Keep the admin/contact exclusions below, even when inheriting global gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types text/css application/javascript image/svg+xml application/xml;

    location ^~ /static/fonts/ {
        alias /srv/dj-nazyer/current/app/static/fonts/;
        expires off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }
    location /static/ {
        alias /srv/dj-nazyer/current/app/static/;
        expires off;
        add_header Cache-Control $nazyer_static_cache_control;
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }
    location ~ "^/uploads/([a-f0-9]{40}(?:-small|-thumb)?\.webp)$" {
        alias /var/lib/dj-nazyer/uploads/$1;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        autoindex off;
    }
    location /uploads/ { return 404; }
    location ~ /\. { deny all; }

    # Shared zones enforce a boundary across the application's two workers.
    location = /admin/login {
        gzip off;
        limit_req zone=nazyer_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/dj-nazyer/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
    location = /kontak {
        gzip off;
        limit_req zone=nazyer_inquiry burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://unix:/run/dj-nazyer/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
    # Other HTML responses with session/CSRF data also remain uncompressed.
    location ^~ /admin {
        gzip off;
        proxy_pass http://unix:/run/dj-nazyer/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
    location ^~ /kontak {
        gzip off;
        proxy_pass http://unix:/run/dj-nazyer/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
    location / {
        proxy_pass http://unix:/run/dj-nazyer/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
}
